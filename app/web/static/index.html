<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试助手</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1>面试助手</h1>
      <button id="sidebar-toggle" title="收起/展开侧边栏">◀</button>
    </div>
    <nav>
      <button data-view="today">今日题目</button>
      <button data-view="bank">题库</button>
      <button data-view="history">历史记录</button>
      <button data-view="review">复习</button>
    </nav>
    <button id="daily-run" class="sidebar-daily">立即更新</button>
    <button id="upload-btn" class="sidebar-upload">上传题目</button>
    <input type="file" id="upload-file" accept=".md,.txt,.pdf,.doc,.docx" hidden>
  </aside>

  <main>
    <section id="view-upload" class="view hidden">
      <div class="card summary-card">
        <div class="summary-num" id="upload-title">上传题目</div>
        <div class="summary-sub">面试档案 · 资料入库</div>
      </div>
      <div class="card">
        <div class="upload-tabs">
          <button class="upload-tab upload-active" data-upload-type="direct">题目列表</button>
          <button class="upload-tab" data-upload-type="facejing">面经文本</button>
          <button class="upload-tab" data-upload-type="resume">简历</button>
        </div>
        <p class="meta" id="upload-desc"></p>
        <div class="upload-row">
          <button id="upload-pick" class="primary">选择文件</button>
          <span id="upload-filename" class="meta">未选择文件</span>
          <input type="file" id="upload-file" accept=".md,.txt,.pdf,.doc,.docx" hidden>
        </div>
        <div class="upload-row hidden" id="upload-count-row">
          <label>生成题目数量
            <input type="number" id="upload-count" min="1" max="10" value="5">
          </label>
        </div>
        <button id="upload-submit" class="primary" disabled>上传</button>
        <div id="upload-status"></div>
      </div>
      <div class="card hidden" id="upload-candidates">
        <h2>候选题目（可编辑校对后确认入库）</h2>
        <div id="candidate-list"></div>
        <button id="candidate-confirm" class="primary">确认入库</button>
      </div>
    </section>

    <section id="view-bank" class="view hidden">
      <div class="card summary-card">
        <div class="summary-num" id="bank-summary"></div>
        <div class="summary-sub">面试档案 · 题库</div>
      </div>
      <div class="card filter-bar">
        <label>题型
          <select id="filter-bank-type">
            <option value="all">全部</option>
            <option value="knowledge">知识题</option>
            <option value="design">设计题</option>
            <option value="project">项目题</option>
          </select>
        </label>
        <label>难度
          <select id="filter-bank-difficulty">
            <option value="all">全部</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>分类
          <select id="filter-bank-category">
            <option value="all">全部</option>
          </select>
        </label>
        <label>搜索
          <input type="search" id="bank-search" placeholder="关键词…">
        </label>
      </div>
      <div class="card-list" id="bank-list"></div>
      <div class="bank-pager">
        <button id="bank-prev">上一页</button>
        <span id="bank-page-info" class="meta"></span>
        <button id="bank-next">下一页</button>
      </div>
    </section>

    <section id="view-today" class="view">
      <div class="card summary-card">
        <div class="summary-num" id="today-summary"></div>
        <div class="summary-sub">面试档案 · 每日一练</div>
      </div>
      <div class="card filter-bar">
        <label>题型
          <select id="filter-today-type">
            <option value="all">全部</option>
            <option value="knowledge">知识题</option>
            <option value="design">设计题</option>
            <option value="project">项目题</option>
          </select>
        </label>
        <label>难度
          <select id="filter-today-difficulty">
            <option value="all">全部</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>分类
          <select id="filter-today-category">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <div id="today-list" class="card-list"></div>
    </section>

    <section id="view-answer" class="view hidden">
      <div class="card">
        <button id="answer-back">← 返回</button>
        <p class="meta" id="answer-meta"></p>
        <h2 id="answer-stem"></h2>
        <div id="answer-chat"></div>
        <details>
          <summary>判分标准提示</summary>
          <p><b>高分标准：</b></p>
          <ul id="answer-good"></ul>
          <p><b>扣分特征：</b></p>
          <ul id="answer-bad"></ul>
        </details>
        <textarea id="answer-input" rows="6" placeholder="输入你的回答…"></textarea>
        <button id="answer-submit" class="primary">提交回答</button>
        <p id="answer-status"></p>
      </div>
    </section>

    <section id="view-result" class="view hidden">
      <div class="card">
        <h2 id="result-title"></h2>
        <div id="result-scores" class="scores"></div>
        <p id="result-review"></p>
        <details>
          <summary>参考答案</summary>
          <p id="result-reference"></p>
        </details>
        <p class="meta" id="result-tags"></p>
        <p class="meta" id="result-ref"></p>
        <button id="result-retry" class="hidden">判分失败，点击重试</button>
        <button id="result-back">返回今日题目</button>
      </div>
    </section>

    <section id="view-history" class="view hidden">
      <div class="card filter-bar">
        <label>状态
          <select id="filter-done">
            <option value="all">全部</option>
            <option value="done">做过</option>
            <option value="undone">未做</option>
          </select>
        </label>
        <label>日期
          <input type="date" id="filter-date-from">
          ~
          <input type="date" id="filter-date-to">
        </label>
        <label>分数
          <select id="filter-score" disabled>
            <option value="all">全部</option>
            <option value="high">高分 ≥80</option>
            <option value="low">低分 &lt;80</option>
          </select>
        </label>
        <label>题型
          <select id="filter-type">
            <option value="all">全部</option>
            <option value="knowledge">知识题</option>
            <option value="design">设计题</option>
            <option value="project">项目题</option>
          </select>
        </label>
        <label>难度
          <select id="filter-difficulty">
            <option value="all">全部</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>分类
          <select id="filter-category">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <div class="card-list" id="history-list"></div>
    </section>

    <section id="view-review" class="view hidden">
      <div class="card">
        <h2 id="review-title"></h2>
        <button id="review-back">返回</button>
      </div>
      <div id="review-entry"></div>
      <div class="card filter-bar hidden" id="review-filter">
        <label>题型
          <select id="filter-review-type">
            <option value="all">全部</option>
            <option value="knowledge">知识题</option>
            <option value="design">设计题</option>
            <option value="project">项目题</option>
          </select>
        </label>
        <label>难度
          <select id="filter-review-difficulty">
            <option value="all">全部</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>分类
          <select id="filter-review-category">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <div class="card-list" id="review-list"></div>
    </section>

    <section id="view-detail" class="view hidden">
      <div class="card">
        <button id="detail-back">← 返回</button>
        <div class="question-head">
          <span class="badge" id="detail-type"></span>
        </div>
        <h2 id="detail-stem"></h2>
        <p class="meta" id="detail-meta"></p>
        <div id="attempt-tabs" class="attempt-tabs"></div>
        <div id="detail-chat"></div>
        <div id="detail-scores" class="scores"></div>
        <p id="detail-review"></p>
        <details>
          <summary>参考答案</summary>
          <p id="detail-reference"></p>
        </details>
        <p class="meta" id="detail-tags"></p>
        <button id="detail-delete">删除本次记录</button>
      </div>
    </section>
  </main>

  <aside id="calendar-panel">
    <div class="calendar-head">
      <button id="calendar-prev" title="上一月">◀</button>
      <span id="calendar-title" title="选择年月"></span>
      <button id="calendar-next" title="下一月">▶</button>
    </div>
    <div class="calendar-clear-row">
      <button id="calendar-clear">清除范围</button>
    </div>
    <div class="calendar-week">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div id="calendar-pick" class="calendar-pick hidden">
      <div class="pick-head">
        <button id="pick-year-prev" title="上一年">◀</button>
        <span id="pick-year"></span>
        <button id="pick-year-next" title="下一年">▶</button>
      </div>
      <div id="pick-months" class="pick-months"></div>
    </div>
    <p class="meta calendar-hint" id="calendar-hint"></p>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
