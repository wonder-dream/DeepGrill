{% extends "base.html" %}
{% block title %}注册 · DeepGrill{% endblock %}
{% block content %}
<section class="card">
  <h1>用邀请码注册</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <p><label>邀请码<br><input type="text" name="invite_code" value="{{ invite }}" required></label></p>
    <p><label>邮箱（登录名）<br><input type="email" name="email" value="{{ email }}" required></label></p>
    <p><label>显示名<br><input type="text" name="username"></label></p>
    <p><label>口令（至少 8 位）<br><input type="password" name="password" required minlength="8"></label></p>
    <p><button class="button" type="submit">注册</button></p>
  </form>
  <p class="muted">已经有账号？<a href="/login">去登录</a></p>
</section>
{% endblock %}
