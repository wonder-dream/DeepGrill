<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}DeepGrill{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=8">
  <link rel="icon" href="/static/favicon.ico?v=1" type="image/x-icon">
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" checked>
  <aside class="sidebar">
    <a class="logo" href="/"><span class="dot"></span><span class="logo-text">deepgrill<span class="caret">_</span></span></a>
    <nav>
      <a class="pill {{ 'active' if request.url.path.startswith('/bank') }}" href="/bank"><span class="g">题</span><span class="lbl">题库</span></a>
      <a class="pill {{ 'active' if request.url.path.startswith('/me') }}" href="/me"><span class="g">我</span><span class="lbl">我的</span></a>
      {% if user and user.role == "owner" %}
      <a class="pill {{ 'active' if request.url.path.startswith('/admin') }}" href="/admin"><span class="g">后</span><span class="lbl">后台</span></a>
      {% endif %}
    </nav>
    <div class="rail-meta">
      {% if user %}
      [ <span class="muted">{{ user.username }}</span> ]
      <form class="inline" method="post" action="/logout"><button class="link" type="submit">退出</button></form>
      {% else %}
      <a class="pill {{ 'active' if request.url.path.startswith('/login') }}" href="/login"><span class="g">登</span><span class="lbl">登录</span></a>
      {% endif %}
    </div>
    <label class="rail-btn" for="nav-toggle" title="收起 / 展开边栏"></label>
  </aside>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="statusbar">
    <span>deepgrill v2 · 模拟面试 · <span class="ok">online</span></span>
    <span>{% if user %}<span class="ok">●</span> {{ user.username }}{% else %}guest{% endif %}</span>
  </footer>
</body>
</html>
