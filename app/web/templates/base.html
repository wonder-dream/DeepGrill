<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DeepGrill{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">DeepGrill</a>
    <nav>
      <a href="/bank">题库</a>
      <a href="/me">我的</a>
      {% if user %}
      <span class="muted">{{ user.username }}</span>
      <form class="inline" method="post" action="/logout"><button class="link" type="submit">退出</button></form>
      {% else %}
      <a href="/login">登录</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
