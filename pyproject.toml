[project]
name = "deepgrill"
version = "0.0.0"
description = "AI 模拟面试平台 —— 三种形态（模拟面试 / 单题追问 / 题库练习）共享同一个面试官"
requires-python = ">=3.13"

# 依赖只列**用途上必需**的，不搬 v1 的 requirements.txt
# （那是 v1 的事实，抄过来就成了第二份会漂的清单）。
# 版本用下界不用 ==：真正可复现的版本记录属于 lock 文件，不属于这里。
dependencies = [
    "fastapi",        # 路由 + Depends 注入 db session + 参数校验（§3.4）
    "uvicorn",        # ASGI 服务器
    "sqlalchemy",     # ORM 与 session
    "pydantic",       # 请求体校验；pydantic-settings 读配置
    "pydantic-settings",
    "jinja2",         # 服务端渲染整页 HTML（ADR-0004）
]
# ⚠️ 这里原先还有 `itsdangerous`（"签名会话 cookie"）—— **已删**。
# 认证用的是 `user_tokens` 表里的不透明令牌 + sha256 存储 + HttpOnly Cookie
# （`docs/v1行为规格.md` §9「继承」），签名 cookie 是**另一套**会话机制，
# 两套并存等于两个会漂的真相。它不是实现时需要再决定的事：令牌形态已经定了。

[project.optional-dependencies]
dev = [
    "pytest",
    # 决策 38：**类型检查与 lint 提交前自动跑** —— "规则写在文档里靠自觉 = 不会发生"。
    # 版本钉住下界：它们的行为会随版本变（新增规则会突然让一批代码变红），
    # 所以升级是一次显式的动作，不是拉一次依赖就发生的事。
    "ruff>=0.15",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 只有 app/ 是包。migrations / prompts / tools / scripts 都在包外 ——
# 这是 ADR-0010 的布局决策，不是遗漏。
packages = ["app"]

# ---------------------------------------------------------------------------
# pytest 配置：**一开始就配死**，不许等出问题再补。
#
# 依据 ADR-0005 与决策 43：v1 的实测失败是「471 个测试写完却从未在根目录跑起来」，
# 根因是既没有 pytest.ini 也没有 pyproject.toml —— pytest 从根目录递归收集时
# 撞进残留目录报 PermissionError。**配错就是第二次"测试跑不起来"。**
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# 收测试的三个位置：领域内的测试随领域走（ADR-0005），跨领域测试在 tests/，
# 迁移的测试跟迁移走（它不是领域，也不是基础设施）。
testpaths = ["app", "migrations", "tests"]
norecursedirs = [".venv", ".uv-cache", "data", "docs", "*.egg-info", "__pycache__", "tools", "scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 导入模式用 importlib，避免不同目录下同名测试文件互相遮蔽
# （领域内测试文件名会重复，如 app/bank/test_repository.py 与别处的同名文件）
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--strict-markers",
    "--strict-config",
    # 关掉 pytest 自己的临时目录插件（tmpdir / tmp_path）。
    #
    # 理由不是洁癖，是实测：这个环境下 pytest 的 tmpdir 插件**必然失败** ——
    #   · 它启动时会 `scandir` 系统临时目录里自己上次留下的 `pytest-of-<用户>`，
    #     而那一步被拒（WinError 5）
    #   · 把 basetemp 指到工作区内也没用：每次跑完那个目录就变得不可读，
    #     删掉重建也照样被拒（tools/_probe_sandbox.py 可复现）
    # v1 的"471 个测试写完却跑不起来"确实出在临时目录上（247 个用例报
    # PermissionError，被记成"非代码失败"）。正确的解法是**不依赖它** ——
    # 临时目录由 `tmp_dir` fixture 提供（见 tests/conftest.py）。
    "-p",
    "no:tmpdir",
    "-p",
    "no:cacheprovider",
]
markers = [
    "slow: 需要真实文件库或较长时间（并发 / WAL 类）",
    "llm: 需要真实调用 LLM（默认不跑）",
]

# ---------------------------------------------------------------------------
# ruff（决策 38：lint 提交前自动跑）
#
# 只开 **bug 类**规则（F/E/W + 少量 B/A）：风格交给 formatter 之外的约定，
# 而"未使用的引用""重定义""宽泛的 except"这些是**真会出错的**。
# 一条满屏风格噪音的规则比没有规则更糟 —— 它会被无视，连真问题一起放过。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
# tools/ 是一次性脚本、data/ 是运行期产物：都不参与 lint（README 与 INDEX 写过它们的性质）
extend-exclude = ["data", ".venv", ".uv-cache"]

[tool.ruff.lint]
# E/W = pycodestyle 的错误与警告，F = pyflakes，I = import 排序，UP = 语法升级，
# B = bugbear（真 bug 类），C4 = 推导式简化，SIM = 可读性
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # E501（行太长）交给 line-length 判断即可，但中文注释里"行长"不等于"列宽"，
    # 而拆中文句子只会让它更难读 —— 所以不把它当错误（formatter 管这件事）。
    "E501",
    # SIM108（用三元表达式）与 SIM105（用 contextlib.suppress）会让"分支里有注释"
    # 的代码更难读 —— 这个项目里注释是主要产物，不为此牺牲可读性。
    "SIM108",
    "SIM105",
    # B008：**FastAPI 的 `Depends(...)` 写在默认值里就是它的官方写法**
    # （`def route(x: int = Form(), s: Session = Depends(get_session))`）。
    # bugbear 这条规则是为"默认值被求值一次"的坑写的，而 FastAPI 正是靠这一点工作。
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# 测试与一次性脚本允许"导入只为副作用"（prompts/tasks 的注册、noqa F401）
"**/test_*.py" = ["B011"]
"tools/*" = ["E", "F", "I", "UP", "B", "C4", "SIM"]

# ---------------------------------------------------------------------------
# mypy（决策 38）
#
# ⚠️ **两个被关掉的错误码是"映射方式"的直接后果，不是偷懒**：
# `app/db/models.py` 用的是 SQLAlchemy 的**命令式映射**（`class User(_Row): pass`
# + 表定义在别处），于是 mypy 看不到任何列：`question.stem` 全被报成
# `attr-defined`，而"读一个可能为 None 的列"接着报成 `union-attr`（108 条）。
#
# 关掉它们换来的是**其余 46 条真错**被修完（fixture 的生成器标注、`X | None` 没窄化、
# 签名与调用不一致…），而不是"990 条错误没人看"。列的真伪由另一条机器检查守着：
# `app/db/test_models.py` 把模型与迁移 SQL **逐列对账**。
#
# 想恢复这两条检查，前提是先把模型改成 declarative + `Mapped[...]` 标注 ——
# 那是一笔独立的、要单独评估的改动（列的定义会变成两处，现在只有迁移一处）。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app", "migrations", "tests"]
# 依赖没有类型标注时不要报错（sqlalchemy 的 stub 覆盖不全）
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
# 见上面的说明：命令式映射的代价
disable_error_code = ["attr-defined", "union-attr"]
# 测试里的 fixture 常常是"故意少一个参数"的替身，`check_untyped_defs` 打开后
# 它们会被逐个体检 —— 那些地方的错不值得修，所以只查"有标注"的函数体。
check_untyped_defs = false
