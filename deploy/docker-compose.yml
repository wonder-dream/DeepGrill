services:
  app:
    build: .
    container_name: interview-assistant
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    env_file: .env
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

volumes:
  hf_cache:
