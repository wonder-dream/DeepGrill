# DeepGrill 源站反代（决策 77）
#
# 链路：访客 → Cloudflare（访客 TLS + CDN）→ 本机 nginx:443（源站 TLS）→ uvicorn:8000
#
# 为什么源站也要 TLS（不只在 Cloudflare 那一层）：
#   "Flexible SSL"（CF→源站明文）会让令牌与会话在公网上裸奔一段，而这段
#   在链路上看起来像内网。用 Cloudflare 的 **Origin Certificate**（免费、15 年）
#   就能把这一段也加密，且源站仍然是标准 nginx —— 换 CDN 不用改部署。
#
# 装法见 deploy/README.md。这份文件是**模板**：把 deepgrill.example.com 换成真实域名。

# --- 限流区：与应用的进程内限流是两道闸 -------------------------------------
# 应用那一层按用户/IP 限（决策 66，带 reserve/settle 语义）；这一层只挡明显的
# 洪水，且它是无状态的 —— 重启应用不会重置它。
limit_req_zone $binary_remote_addr zone=deepgrill_all:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=deepgrill_auth:10m rate=1r/s;

# Cloudflare 的真实访客 IP 在 CF-Connecting-IP；要把 remote_addr 换成它，
# 否则 nginx 这一层看到的全是 CF 边缘节点。
# ⚠️ 只有**只允许 Cloudflare 回源**时才能这么信 —— 源站端口若对全网开放，
# 任何人都能伪造这个头。所以下面的 server 块只放行 CF 的网段。
map $http_cf_connecting_ip $real_client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

server {
    listen 80;
    server_name deepgrill.example.com;
    # 只做跳转。Cloudflare 那边也会跳，但源站立马可用不依赖它。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name deepgrill.example.com;

    # Cloudflare Origin Certificate（免费、15 年）—— 只被 Cloudflare 信任。
    ssl_certificate     /etc/ssl/cloudflare/deepgrill.pem;
    ssl_certificate_key /etc/ssl/cloudflare/deepgrill.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ⚠️ **录音上传要过这一层**：nginx 默认 client_max_body_size 是 1m，而
    # `app/llm/stt.py` 的 MAX_AUDIO_BYTES 是 8m —— 不改这里，超过 1MB 的语音回答
    # 会在生产上被挡成 413，而开发机上用 uvicorn 根本看不到这层。
    # 这个数字由 tests/test_deploy_units.py 钉住：它不许小于应用的 8MB。
    client_max_body_size 16m;

    # 2C2G：超时给足一次 LLM 流式回答的时间（SSE 会长时间不结束）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- 加固 ---------------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 本站只有面试页跑 JS，且脚本是本地文件（ADR-0004）—— 不吃外部资源
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'" always;

    # --- 应用 ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # SSE（面试页）必须关掉缓冲，否则"流式"会变成"一次性"
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 应用里那个开关必须同时打开（DEEPGRILL_TRUST_PROXY_HEADERS=true），
        # 否则按 IP 的限流会把所有访客看成同一个来源。
        limit_req zone=deepgrill_all burst=20 nodelay;
    }

    # 登录/注册单独一档：爆破这一层就该拦住，不必等到应用
    location = /login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_auth burst=5 nodelay;
    }

    location = /register {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_auth burst=5 nodelay;
    }

    # 后台（owner 专用）：**在反代这一层再收一道**（纵深防御）
    #
    # 为什么值得加：`/admin/**` 是唯一能改全局装配（知识层人审、账号、邀请码）的地方，
    # 而它此前和首页一样对全网开放 —— 唯一挡着的是 owner 那一份口令。owner 口令在
    # 迁移里是明文可读的占位值（决策 58 让进程拒绝带着它启动），所以口令一旦没换，
    # 后台就是敞开的。反代这一层即使配错了也只是"多一道"，不影响功能。
    #
    # ⚠️ **上线前必须把下面的 allow 改成你自己的出口 IP**（或公司网段）。
    #    三个选择，从省事到严格：
    #      ① 只留自己的固定 IP：`allow 203.0.113.7; deny all;`
    #      ② 走 Cloudflare 的话可以只允许 CF 的出口网段（那份列表会变，别抄死）
    #      ③ 更彻底：在 Cloudflare 上给 /admin 挂 Access（连登录页都进不去）——
    #         那种做法下本段可以删掉，`tests/test_deploy_units.py` 会同步提醒
    #
    # 注意 `deny all` 是**故意**留着的：忘了填 IP 的后果是"自己也进不去后台"，
    # 而不是"后台对所有人开放" —— 失败方向必须是安全的那一边。
    location ^~ /admin {
        allow 127.0.0.1;
        allow ::1;
        # ↓↓↓ 改成你自己的出口 IP（可多行）↓↓↓
        # allow 203.0.113.7;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_all burst=20 nodelay;
    }

    # 静态资源：应用已经带 Cache-Control（决策 23 的静态缓存），这里顺带压掉日志噪音
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 探活不该被限流：它是外部探针，被限流会把整个站点判成挂了
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
