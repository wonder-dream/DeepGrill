# DeepGrill 源站反代（决策 77）
#
# 链路（**同一份配置覆盖两个阶段**，切 Cloudflare 那天不用改这个文件）：
#
#   阶段一（Cloudflare 名称服务器还没生效 → 域名直连源站）：
#       访客 ──TLS──> 本机 nginx:443 ──> uvicorn:8000
#   阶段二（Cloudflare 生效、橙云代理后）：
#       访客 ──TLS──> Cloudflare ──TLS──> 本机 nginx:443 ──> uvicorn:8000
#
# 为什么证书用 **Let's Encrypt** 而不是 Cloudflare Origin Certificate：
#   CF 的 **Full (strict)** 模式接受任何公开可信的证书，Let's Encrypt 就是一张。
#   于是"直连"和"走 CF"共用同一张证书 —— 切 CF 那天不需要换证书、也不需要重启
#   任何东西。Origin Certificate（免费、15 年）只在你想用 CF 的 Full 模式配自签
#   证书时才需要；它**不被浏览器信任**，所以直连阶段用它等于站点打不开。
#
# ⚠️ 阶段二要多做一件事（这个文件不用改）：把源站的 80/443 **只放行 Cloudflare 网段**。
#    否则任何人都能绕过 CF 直连源站，还能伪造 CF-Connecting-IP 骗过下面的限流。

# Cloudflare 的真实访客 IP 在 CF-Connecting-IP。要把 remote_addr 换成它，否则
# nginx 这一层看到的全是 CF 边缘节点。
# 没走 CF 时（阶段一直连）这个头不存在 → 回落到 $remote_addr —— 两种形态都对。
#
# ⚠️ 这个 map **故意**只靠头判断，因此阶段一（源站对全网开放）里伪造这个头可以
#    骗过按 IP 的限流。这是可接受的过渡态：上线前的真实风险由应用那一层按**账号**
#    的限流兜住（决策 92）。阶段二把源站锁到 CF 网段之后，这个洞自动消失 ——
#    **那一步是必须做的**，不是可选项。
map $http_cf_connecting_ip $real_client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

# --- 限流区：与应用的进程内限流是两道闸 -------------------------------------
# 应用那一层按用户/IP 限（决策 66，带 reserve/settle 语义）；这一层只挡明显的
# 洪水，且它是无状态的 —— 重启应用不会重置它。
#
# ⚠️ 键必须用 $real_client_ip，**不能**用 $binary_remote_addr：阶段二里
#    remote_addr 是 CF 的边缘节点地址，用它当键等于**全站所有访客共用一个桶**
#    （10r/s 会把正常流量一起挡掉，现象是"偶发 503"，本地永远复现不出来）。
#    tests/test_deploy_units.py 钉住了这一点。
limit_req_zone $real_client_ip zone=deepgrill_all:10m rate=10r/s;
limit_req_zone $real_client_ip zone=deepgrill_auth:10m rate=1r/s;

server {
    listen 80;
    server_name deepgrill.asia www.deepgrill.asia;

    # 证书续期要走这里：certbot certonly --webroot -w /var/www/certbot ...
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律跳 HTTPS。
    # 注意它写在 location 里而不是 server 级的 `return 301` —— server 级的
    # rewrite 在 location 匹配**之前**执行，会把 ACME 挑战一起 301 掉，续期就断了。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name deepgrill.asia www.deepgrill.asia;

    # 用 `listen 443 ssl http2` 而不是 nginx ≥1.25 的 `http2 on;`：
    # Ubuntu 22.04 自带的是 nginx 1.18，`http2 on;` 会直接报 unknown directive
    # （nginx -t 就过不去）。这个写法在新版上只是一条 deprecation 警告。
    ssl_certificate     /etc/letsencrypt/live/deepgrill.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepgrill.asia/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 挑战路径在 **443 这块也要有一份**：走 Cloudflare 的 Full (strict) 时，CF 是
    # **始终**用 HTTPS 回源的（访客用 http 也一样），续期请求会落到这个 server 块上。
    # 只写在 80 那块里的话，第一次签发能成功（那时 CF 还没接管），60 天后自动续期
    # 会静默失败 —— 而失败方式是"证书过期当天站点全挂"。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ⚠️ **录音上传要过这一层**：nginx 默认 client_max_body_size 是 1m，而
    # `app/llm/stt.py` 的 MAX_AUDIO_BYTES 是 8m —— 不改这里，超过 1MB 的语音回答
    # 会在生产上被挡成 413，而开发机上用 uvicorn 根本看不到这层。
    # 这个数字由 tests/test_deploy_units.py 钉住：它不许小于应用的 8MB。
    client_max_body_size 16m;

    # 2C2G：超时给足一次 LLM 流式回答的时间（SSE 会长时间不结束）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- 加固 ---------------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 本站只有面试页跑 JS，且脚本是本地文件（ADR-0004）—— 不吃外部资源
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'" always;

    # --- 应用 ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # SSE（面试页）必须关掉缓冲，否则"流式"会变成"一次性"
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        # **不要**用 $proxy_add_x_forwarded_for：那是"把访客自己送来的
        # X-Forwarded-For 接在后面"，等于把伪造权交给访客。应用侧读取的就是这个头。
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 应用里那个开关必须同时打开（DEEPGRILL_TRUST_PROXY_HEADERS=true），
        # 否则按 IP 的限流会把所有访客看成同一个来源。
        limit_req zone=deepgrill_all burst=20 nodelay;
    }

    # 登录/注册单独一档：爆破这一层就该拦住，不必等到应用
    location = /login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_auth burst=5 nodelay;
    }

    location = /register {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_auth burst=5 nodelay;
    }

    # 后台（owner 专用）：**在反代这一层再收一道**（纵深防御）
    #
    # 为什么值得加：`/admin/**` 是唯一能改全局装配（知识层人审、账号、邀请码）的地方，
    # 而它此前和首页一样对全网开放 —— 唯一挡着的是 owner 那一份口令。owner 口令在
    # 迁移里是明文可读的占位值（决策 58 让进程拒绝带着它启动），所以口令一旦没换，
    # 后台就是敞开的。反代这一层即使配错了也只是"多一道"，不影响功能。
    #
    # ⚠️ 这一道**刻意不用 IP 白名单**（决策 94）。曾经用的是
    #    `allow <你的出口 IP>; deny all;`，它在上线当天连撞三次：
    #      ① `allow`/`deny` 比的是 **TCP 对端地址** —— 经 Cloudflare 进来的对端
    #         永远是 CF 边缘节点，得先装 realip 才有意义（见文件开头）；
    #      ② 装了 realip 之后仍然进不去：**双栈网络里浏览器优先走 IPv6**，
    #         只放行 IPv4 的症状是"我 curl 能进、浏览器 403"；
    #      ③ IPv6 的隐私扩展还会周期性换掉主机位 —— 放行单个地址会反复失效。
    #    Basic 认证与网络无关，纵深防御的属性不变：它独立于应用里的 owner 登录，
    #    失败方向同样是"进不去"。
    #
    # 口令文件（生成与重设见 deploy/README.md）：
    #     sudo htpasswd -c /etc/nginx/.htpasswd-admin admin
    #     sudo chown root:www-data /etc/nginx/.htpasswd-admin
    #     sudo chmod 640 /etc/nginx/.htpasswd-admin
    location ^~ /admin {
        auth_basic           "DeepGrill 后台";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=deepgrill_all burst=20 nodelay;
    }

    # 静态资源：应用已经带 Cache-Control（决策 23 的静态缓存），这里顺带压掉日志噪音
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 探活不该被限流：它是外部探针，被限流会把整个站点判成挂了
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
