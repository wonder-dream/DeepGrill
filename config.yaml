llm:
  base_url: https://api.deepseek.com/v1
  api_key_env: LLM_API_KEY        # 从 .env / 环境变量读, 不落盘
  generate_model: deepseek-chat
  judge_model: deepseek-reasoner  # 可配更强模型
nowcoder:
  cookie_env: NOWCODER_COOKIE     # 仅本地个人牛客源使用, gitignore 排除
  request_interval: 1.5           # 秒
  retries: 3
daily:
  max_new_questions: 36           # 每日新入库不重复问题上限(D16，严格截断)；清历史积压时可临时调大跑几轮再改回
  knowledge_limit: 5              # 当日待做: 知识型 3-5
  design_limit: 2                 # 当日待做: 场景题 1-2
  project_limit: 1                # 当日待做: 项目深挖 0-1
  chain_max_rounds: 20            # 追问链轮数上限(D15)
  schedule: "08:00"
notification:
  enabled: true
smtp:
  host_env: SMTP_HOST          # 验证码邮件（163: smtp.163.com / QQ: smtp.qq.com）
  port_env: SMTP_PORT          # 465（SSL）
  user_env: SMTP_USER          # 发件邮箱（163/QQ 全名）
  pass_env: SMTP_PASS          # 授权码（非登录密码；从 .env 读）
sources:
  nowcoder_enabled: false      # 牛客采集开关：生产/公开默认关闭，仅本地个人学习显式开启
  github_require_license: true # 无许可/不在白名单的 GitHub 仓库整仓跳过
  github_allowed_licenses:     # 允许存储/改写/再分发的宽松许可白名单
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - Unlicense
    - CC0-1.0
  github_repos:                # 面经仓库列表（可增删；也支持对象写法带 manual_license/expected_license）
    - Zchary1106/agent-interview-hub
    - houchenll/origin-llm
    - adongwanai/AgentGuide
    - bcefghj/ai-agent-interview-guide
    - Lau-Jonathan/LLM-Agent-Interview-Guide
    - Snailclimb/AIGuide
    - limouren2000/llms-dev-study
    - guoguo-tju/agent_java_offer
    - GongLingRui/llm-agents-interview

ugc:
  enabled: true
  max_per_user_per_day: 10
  max_content_bytes: 20971520      # 20MB
  require_consent: true
feedback:
  enabled: true
  duplicate_candidate_min_sim: 0.78   # 含边界
  duplicate_max_select: 3